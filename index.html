<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search for music..." />
        <button id="searchButton"><i class="fas fa-search"></i></button>
      </div>

      <div class="search-results" id="searchResults">
        <!-- Search results will be populated here -->
      </div>

      <!-- Queue Container -->
      <div class="queue-container">
        <div class="queue-header">
          <span>Up Next</span>
          <span id="queueCount">0 songs</span>
        </div>
        <div class="queue-list" id="queueList">
          <!-- Queue items will be populated here -->
        </div>
      </div>

      <div class="music-player">
        <div class="song-info">
          <img
            src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMTAwIDEwMCI+PHJlY3Qgd2lkdGg9IjEwMCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiMzMzMiLz48dGV4dCB4PSI1MCIgeT0iNTAiIGZvbnQtc2l6ZT0iMjAiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZpbGw9IiNmZmYiIGR5PSIuM2VtIj5ObyBJbWFnZTwvdGV4dD48L3N2Zz4="
            alt="Album Art"
            id="albumArt"
          />
          <div class="song-details">
            <h2 id="songTitle">No song selected</h2>
            <p id="artistName">-</p>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress" id="progress"></div>
          </div>
          <div class="time-stamps">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button id="prevBtn" class="control-btn">
            <i class="fas fa-backward"></i>
          </button>
          <button id="backwardBtn" class="control-btn">
            <i class="fas fa-step-backward"></i>
          </button>
          <button id="playPauseBtn" class="control-btn">
            <i class="fas fa-play"></i>
          </button>
          <button id="forwardBtn" class="control-btn">
            <i class="fas fa-step-forward"></i>
          </button>
          <button id="nextBtn" class="control-btn">
            <i class="fas fa-forward"></i>
          </button>
        </div>

        <!-- Volume Control -->
        <div class="volume-control">
          <button id="volumeBtn" class="volume-icon">
            <i class="fas fa-volume-up"></i>
          </button>
          <input
            type="range"
            id="volumeSlider"
            class="volume-slider"
            min="0"
            max="100"
            value="100"
          />
          <div class="volume-tooltip">100%</div>
        </div>
      </div>
    </div>

    <!-- Song Menu Template (Hidden by default) -->
    <div class="song-menu" id="songMenu">
      <div class="song-menu-item" data-action="queue">
        <i class="fas fa-list"></i>
        Add to Queue
      </div>
      <div class="song-menu-item" data-action="playlist">
        <i class="fas fa-plus"></i>
        Add to Playlist
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
